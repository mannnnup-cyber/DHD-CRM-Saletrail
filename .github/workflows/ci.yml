name: CI + Deploy

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (Vite production)
        run: npm run build

      - name: Deploy to Vercel
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        run: npx vercel --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID: team_oR9AcZvAU91AR7ralAlffIB3
          VERCEL_PROJECT_ID: prj_USKJsJQAVoYMosqbE19F6bre2nhK
